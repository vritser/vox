name: Emacs
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        emacs-version: ['28.2', '29.4', '30.2']
    steps:
      - uses: actions/checkout@v4
      - uses: purcell/setup-emacs@master
        with:
          version: ${{ matrix.emacs-version }}
      - name: Install virtual-audio dependency
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Fetch audited WebSocket dependency
        run: |
          mkdir -p .deps
          curl --fail --location --proto '=https' --tlsv1.2 \
            https://raw.githubusercontent.com/ahyatt/emacs-websocket/3210187c107cdbb075b2e47454068a22f38213fc/websocket.el \
            -o .deps/websocket.el
          echo '95c653a3013288cad061394ea3ab175a8d6834caf19acf83e384f6c5cbf20ad2  .deps/websocket.el' | sha256sum --check
      - run: make check
      - run: make benchmark
